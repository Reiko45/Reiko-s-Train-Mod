# Mod metadata. The placeholder values are filled in from gradle.properties at build time.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Reiko45/Reiko-s-Train-Mod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/Reiko45/Reiko-s-Train-Mod"
logoFile="logo.png"
logoBlur=false
description='''
Big trains on their own track, and trams in the street. Lay track block by block or draw curves, ramps and junctions from one block to another, or let the track-laying wagon lay a whole line for you: cuttings, tunnels, embankments and bridges, with overhead wires if you like.

Drive a green tank engine, a crimson express with its tender, a diesel on BuildCraft Reborn's fuel, an electric, the 100 km/h Bullet Train, or a vintage or low-floor tram, with coaches, freight, tank, livestock and car transporter wagons and a guard's van behind. Throttle, brake, whistle, and left or right at every junction.

Signal the line with two-, three- and four-aspect signals, work it from a signal box with a live map and routes, set switches by hand or with redstone, and put up speed limits, level crossings and track sensors. Name the stations and give trains timetables to run by themselves, leaving and picking up wagons, loading and unloading freight at wagon loaders, taking water at water towers and turning on turntables. Keep them going from engine sheds, charging points and electrified lines.

With Patchouli, the Railway Handbook explains all of it in the game. Optional extras: Reiko's Car Mod (cars and trailers by rail), Xaero's Minimap and World Map (trains on the map), and JEI.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: with Xaero's Minimap, trains show on the minimap.
[[dependencies.${mod_id}]]
    modId="xaerominimap"
    type="optional"
    versionRange="[24,)"
    ordering="NONE"
    side="CLIENT"

# Optional: with Xaero's World Map, trains show on the world map, and clicking one says what it's doing. (Read by
# reflection, so another version just means no trains on the map.)
[[dependencies.${mod_id}]]
    modId="xaeroworldmap"
    type="optional"
    versionRange="[1.30,)"
    ordering="NONE"
    side="CLIENT"

# Optional: with Reiko's Car Mod, car transporter wagons carry its cars and their trailers.
[[dependencies.${mod_id}]]
    modId="reikocars"
    type="optional"
    versionRange="[1.39,)"
    ordering="NONE"
    side="BOTH"

# Optional: with Patchouli, the Railway Handbook: the mod's guide book, given to each player once and craftable.
[[dependencies.${mod_id}]]
    modId="patchouli"
    type="optional"
    versionRange="[1.21-80,)"
    ordering="NONE"
    side="BOTH"

# Optional: with JEI, each of the mod's items has an information page, and there are pages for what locomotives run
# on and what the track-laying wagon fills dips with.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="NONE"
    side="BOTH"

# The diesel locomotive runs on BuildCraft Reborn's fuels: Dense Fuel and Mixed Heavy Fuels.
[[dependencies.${mod_id}]]
    modId="buildcraftreborn"
    type="required"
    versionRange="${buildcraft_version_range}"
    ordering="AFTER"
    side="BOTH"
