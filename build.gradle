plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets {
    // Compile-time stand-ins for the few classes of the optional mods the train mod works with: Xaero's Minimap
    // (client/TrainsXaero) and Reiko's Car Mod (train/CarCargo). They're optional, so these are compiled against
    // instead; they never go in the jar or on the dev runs' classpath, where the real mods are used if they're there.
    stubs
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runClient -Pshowcase builds a test scene, drives a train and saves screenshots (see DevShowcase).
            systemProperty 'reikotrains.showcase', project.hasProperty('showcase') ? 'true' : 'false'
            // -PshowcaseFrom=<tick>: skip to the showcase's steps from that tick, to check one scene.
            systemProperty 'reikotrains.showcaseFrom', (project.findProperty('showcaseFrom') ?: '0').toString()
            // -PshowcaseBook: instead, every spread of the Railway Handbook, the JEI pages and a handbook button
            // (run python3 tools/guidebook/book.py first: it lists the spreads in run/guide-spreads.txt).
            systemProperty 'reikotrains.showcaseBook', project.hasProperty('showcaseBook') ? 'true' : 'false'
            // -PrejoinTest: builds a train, saves and quits, opens the world again and checks it still works (see DevRejoin).
            systemProperty 'reikotrains.rejoinTest', project.hasProperty('rejoinTest') ? 'true' : 'false'
            // -PwindowSize=1280x720: a bigger window, for bigger screenshots.
            def windowSize = project.findProperty('windowSize')
            if (windowSize) {
                def (w, h) = windowSize.toString().tokenize('x')
                programArguments.addAll('--width', w, '--height', h)
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Starts a server, runs every game test in the mod, then exits: ./gradlew runGameTestServer
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.stubs)

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // JEI and Patchouli. Only their APIs are compiled against; the full mods go on the dev runs' classpath.
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "vazkii.patchouli"
        }
    }
}

dependencies {
    // BuildCraft Reborn: its fuels (and their energy values) are what the diesel locomotive runs on. It's required at
    // runtime too, so it goes on the dev runs' classpath, where NeoForge loads it as a mod.
    implementation files("libs/${buildcraft_jar}")

    // Xaero's Minimap is optional: trains show on it. So is Reiko's Car Mod: car transporter wagons carry its cars.
    // Both are compiled against stand-ins (see sourceSets.stubs); to try them in a dev run, pass the folder their jars
    // are in (the car mod's with Reiko's Economy, which it needs):
    // ./gradlew runClient -PxaeroJars=/path/to/folder -PcarJars=/path/to/other/folder
    compileOnly sourceSets.stubs.output

    // JEI is optional: the plugin in compat/jei (information pages, what locomotives run on, what the track-laying
    // wagon fills with) only loads when JEI is installed.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // Patchouli is optional too: it shows the Railway Handbook (assets/reikotrains/patchouli_books/railway_handbook).
    // Only its API is compiled against, in compat/patchouli. -PnoOptionalMods leaves both out of the dev runs.
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}:api"
    if (!project.hasProperty('noOptionalMods')) {
        localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") {
            transitive = false // the mod jar has everything it needs inside it
        }
        localRuntime("vazkii.patchouli:Patchouli:${patchouli_version}") {
            transitive = false
        }
    }
    for (folder in [project.findProperty('xaeroJars'), project.findProperty('carJars')]) {
        if (folder != null) {
            localRuntime fileTree(folder.toString()) { include '*.jar' }
        }
    }
}

// Fills in the ${...} placeholders in neoforge.mods.toml from gradle.properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            buildcraft_version_range: buildcraft_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The screenshot showcase is for development only.
tasks.named('jar', Jar) {
    exclude 'com/reiko/trains/dev/**'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
